name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'opencv-python-headless>=4.8,<5' 'pytest>=8,<9' build
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m pip install --no-deps dist/*.whl
      - name: Exercise installed CLI and bundled palette outside checkout
        run: |
          cd "$RUNNER_TEMP"
          python -c "import cv2,numpy as np; cv2.imwrite('red.png',np.full((2,2,3),(0,0,255),dtype=np.uint8))"
          color-detect --image red.png --pixel 0 0
